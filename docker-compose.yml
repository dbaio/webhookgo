# docker compose up -d   → http://localhost:8080
# Settings can be overridden in a .env file next to this one (see .env.example).
name: webhookgo

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    # Built from source by default: `up -d` always rebuilds (cached, fast). To
    # run the published image instead, set IMAGE and PULL_POLICY (.env.example).
    image: ${IMAGE:-webhookgo:${VERSION:-dev}}
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_NAME: ${APP_NAME:-webhookgo}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_REQUESTS: ${MAX_REQUESTS:-500}
      TOKEN_TTL: ${TOKEN_TTL:-7d}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-2MB}
      MAX_DELAY: ${MAX_DELAY:-30}
      MAX_URL_STORAGE: ${MAX_URL_STORAGE:-64MB}
      RATE_LIMIT: ${RATE_LIMIT:-600}
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:-30}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-1200}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-180d}
      ABUSE_CONTACT: ${ABUSE_CONTACT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Accounts (README → Accounts): off by default. With ACCOUNTS=on and
      # COMPOSE_PROFILES=accounts, the app uses the postgres service below
      # through the PG* variables; DATABASE_URL points at an external one.
      ACCOUNTS: ${ACCOUNTS:-off}
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: postgres
      PGUSER: webhookgo
      PGDATABASE: webhookgo
      PGPASSWORD: ${POSTGRES_PASSWORD:-webhookgo}
      PGSSLMODE: disable
      SESSION_TTL: ${SESSION_TTL:-30d}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      ANONYMOUS_URLS: ${ANONYMOUS_URLS:-on}
      ACCOUNT_MAX_URLS: ${ACCOUNT_MAX_URLS:-100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false # without the "accounts" profile the app starts without it
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only with COMPOSE_PROFILES=accounts. No ports: reachable from the Compose
  # network only.
  postgres:
    image: postgres:18-alpine
    profiles: [accounts]
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhookgo
      POSTGRES_USER: webhookgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhookgo}
    volumes:
      - postgres-data:/var/lib/postgresql # the PG 18+ layout
    healthcheck:
      # -h forces TCP: while the image initialises, its temporary server
      # only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h localhost -U webhookgo -d webhookgo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
